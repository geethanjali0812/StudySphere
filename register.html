<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudySphere - Register</title>

    <link rel="stylesheet" href="register.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="register-container">

        <!-- LEFT SIDE -->
        <div class="register-left">

            <div class="brand">
                <h1>🎓 StudySphere</h1>
                <p>Smart Student Learning Portal</p>
            </div>

            <div class="welcome-text">

                <h2>Start Your Learning Journey 🚀</h2>

                <p>
                    Create your StudySphere account and manage
                    your studies, tasks, notes, exams and progress
                    in one place.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="register-right">

            <div class="register-box">

                <h2>Create Account</h2>

                <p class="subtitle">
                    Register to get started with StudySphere
                </p>


                <!-- NAME -->
                <div class="input-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="registerName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->
                <div class="input-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <!-- CREATE PASSWORD -->
                <div class="input-group">

                    <label for="registerPassword">
                        Create Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create your password"
                            required
                        >

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter your password"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD MESSAGE -->
                <p id="passwordMessage"></p>


                <!-- REGISTER BUTTON -->
                <button
                    type="button"
                    id="registerBtn"
                    class="register-btn"
                >
                    Create Account
                </button>


                <!-- MESSAGE -->
                <p id="registerMessage"></p>


                <!-- LOGIN LINK -->
                <p class="login-link">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="register.js"></script>

</body>

</html>

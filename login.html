<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudySphere - Login</title>

    <link rel="stylesheet" href="login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-left">

            <div class="brand">
                <h1>🎓 StudySphere</h1>
                <p>Smart Student Learning Portal</p>
            </div>

            <div class="welcome-text">

                <h2>Welcome Back! 👋</h2>

                <p>
                    Continue your learning journey with StudySphere.
                    Manage your tasks, study sessions, CGPA, notes
                    and exams all in one place.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-right">

            <div class="login-box">

                <h2>Welcome Back</h2>

                <p class="subtitle">
                    Login to your StudySphere account
                </p>


                <!-- EMAIL -->
                <div class="input-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                        >

                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                        >

                    </div>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="button"
                    id="loginBtn"
                    class="login-btn"
                >
                    Login
                </button>


                <!-- MESSAGE -->
                <p id="loginMessage"></p>


                <!-- REGISTER LINK -->
                <p class="register-link">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
